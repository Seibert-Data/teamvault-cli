name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Trivy
        env:
          # Pinned release: the version is fixed so the scan is reproducible, and
          # the archive's checksum is verified from the same release. No install
          # script is executed — the previous step piped one from the moving
          # `main` branch into `sudo sh`, and the older one used `apt-key`, which
          # ubuntu-24.04 (the current ubuntu-latest) removed.
          TRIVY_VERSION: 0.76.1
        run: |
          set -euo pipefail
          cd /tmp
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL -o "$archive" "${base}/${archive}"
          curl -sSfL -o checksums.txt "${base}/trivy_${TRIVY_VERSION}_checksums.txt"
          grep -E "  ${archive}\$" checksums.txt | sha256sum -c -
          sudo tar -xzf "$archive" -C /usr/local/bin trivy
          trivy --version

      - name: Run precommit checks
        run: make precommit

      - name: Upload coverage reports
        uses: codecov/codecov-action@v5
        if: always()
        with:
          fail_ci_if_error: false

  # Hermetic end-to-end test: start the fake TeamVault server (cmd/fakevault)
  # and drive the real teamvault-cli binary against it — no live TeamVault, no
  # Keychain. Exercises the real HTTP connector + auth + parse path.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run e2e
        run: make e2e

  # Validate the release pipeline on every PR so a broken .goreleaser.yaml
  # surfaces here, not only at tag-push. `build` skips the publish/brew steps,
  # so no tokens are needed.
  goreleaser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate GoReleaser config
        uses: goreleaser/goreleaser-action@v6
        with:
          version: 'v2.17.0'
          args: check

      - name: Snapshot build (no publish)
        uses: goreleaser/goreleaser-action@v6
        with:
          version: 'v2.17.0'
          args: build --snapshot --clean
